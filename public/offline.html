<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Jell World</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0c0c1a;
        color: #f1f1f3;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 80px;
        margin: 0 0 8px;
        color: #ffcb52;
      }
      p {
        margin: 4px 0;
        color: #aab;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>offline</h1>
        <p>You are offline. Reconnect and the page will load again.</p>
        <p>
          If this is the first visit on this connection, please come back
          online.
        </p>
      </div>
    </main>
  </body>
</html>
